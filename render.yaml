# ==============================================================================
# IntelliGreen Technologies Field Service — Render Free Tier Blueprint
# 100% Free Single-Service Deployment (FastAPI + React PWA together via Docker)
# ==============================================================================
services:
  - type: web
    name: intelligreen-portal
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: MANAGER_EMAIL
        value: vikash@intelligreentech.com
      - key: COMPANY_EMAIL
        value: info@intelligreentech.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_SSL
        value: "false"
      - key: SMTP_FROM_NAME
        value: "IntelliGreen Technologies Field Service"
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
